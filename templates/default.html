<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>$title$ — Eventium</title>
    <link rel="stylesheet" href="/css/main.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Eventium</a>
      <nav>
        <a href="/docs/">Docs</a>
        <a href="/examples/">Examples</a>
        <a href="https://github.com/eventium-hs/eventium">GitHub</a>
      </nav>
    </header>
    $body$
    <footer class="site-footer">
      <p>Eventium — event sourcing for Haskell. MIT licensed.</p>
    </footer>
    <script>
      // GoatCounter analytics — skip local dev so previews don't pollute stats.
      if (location.hostname !== "localhost" && location.hostname !== "127.0.0.1") {
        var gc = document.createElement("script");
        gc.async = true;
        gc.src = "//gc.zgo.at/count.js";
        gc.setAttribute("data-goatcounter", "https://eventium-dev.goatcounter.com/count");
        document.head.appendChild(gc);
      }
    </script>
  </body>
</html>
